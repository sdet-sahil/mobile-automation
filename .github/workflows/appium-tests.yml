name: Appium Emulator Tests (Python & Pytest)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # LAYER 1: Python and Pip Dependency Cache
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Automatically caches your pip downloads based on requirements.txt

      # Install Python dependencies (Appium-Python-Client, pytest, etc.)
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # LAYER 2: Node.js (Still needed just to run the Appium Server binary)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: |
          appium --allow-cors &
          sleep 5

      # LAYER 3: Android Emulator / AVD Snapshot Cache
      - name: Cache Android Emulator AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api29-mac-${{ runner.os }}

      # LAYER 4: Execute Pytest inside the Emulator Runner
      - name: Run Android Emulator and Execute Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          force-avd-creation: false
          script: |
            echo "Emulator is ready. Running Pytest..."
            pytest tests/ -v

            # This step runs even if the pytest step before it fails
      - name: Upload Appium Logs
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts
